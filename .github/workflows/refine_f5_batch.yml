name: Refine F5 Batch CSV ..

on:
  push:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel row jobs inside each matrix job (max 3)"
        required: false
        default: "3"
      ls_time_limit_sec:
        description: "Local-search time limit per row (seconds)"
        required: false
        default: "120"
      n_truck:
        description: "Number of trucks"
        required: false
        default: "2"
      n_drone:
        description: "Number of drones"
        required: false
        default: "1"
      csv_files:
        description: "CSV list (JSON array or comma/newline list). Leave empty to use defaults in YAML."
        required: false
        default: ""

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      total: ${{ steps.mk.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Build CSV matrix
        id: mk
        env:
          CSV_FILES_INPUT: ${{ github.event.inputs.csv_files || '' }}
          DEFAULT_CSV_FILES: |
            result/Question4,14/To_refine_csv_2truck_1drone/50 batch cluster 2 truck 1 drone.csv
        run: |
          python - << 'PY'
          import json, os
          import pathlib

          def parse_csv_list(raw: str):
              raw = (raw or "").strip()
              if not raw:
                  return []
              if raw.startswith("["):
                  arr = json.loads(raw)
                  if not isinstance(arr, list):
                      raise SystemExit("csv_files JSON must be an array")
                  return [str(x).strip() for x in arr if str(x).strip()]
              out = []
              for ln in raw.splitlines():
                  for part in ln.split(","):
                      s = part.strip()
                      if s:
                          out.append(s)
              return out

          user_list = parse_csv_list(os.environ.get("CSV_FILES_INPUT", ""))
          default_list = parse_csv_list(os.environ.get("DEFAULT_CSV_FILES", ""))
          chosen = user_list if user_list else default_list
          if not chosen:
              raise SystemExit("No csv_files provided and DEFAULT_CSV_FILES is empty")

          files = []
          seen = set()
          for s in chosen:
              p = pathlib.Path(s)
              if not p.is_file():
                  raise SystemExit(f"CSV not found: {p}")
              key = str(p)
              if key in seen:
                  continue
              seen.add(key)
              files.append(p)

          if not files:
              raise SystemExit("No valid input csv files")
          matrix = []
          for i, p in enumerate(files, start=1):
              matrix.append({
                  "idx": i,
                  "csv": str(p),
                  "name": p.stem.replace(" ", "_")
              })
          with open("matrix.json", "w", encoding="utf-8") as f:
              json.dump(matrix, f)
          print(json.dumps(matrix))
          print(f"Total csv jobs: {len(matrix)}")
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(python - << 'PY'
          import json
          print(len(json.load(open('matrix.json'))))
          PY
          )" >> "$GITHUB_OUTPUT"

  refine:
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build read_data_f5
        run: g++ -std=c++17 -O2 C_Version/Function5.cpp -o C_Version/read_data_f5

      - name: Run refine/improve/recompute for one CSV
        env:
          INPUT_CSV: ${{ matrix.task.csv }}
          WORKERS: ${{ github.event.inputs.workers || '3' }}
          LS_TIME_LIMIT_SEC: ${{ github.event.inputs.ls_time_limit_sec || '120' }}
          N_TRUCK: ${{ github.event.inputs.n_truck || '2' }}
          N_DRONE: ${{ github.event.inputs.n_drone || '1' }}
        run: |
          if [ "${WORKERS}" -gt 3 ]; then
            echo "WORKERS=${WORKERS} exceeds runner-safe limit, clamp to 3"
            WORKERS=3
          fi
          if [ ! -f "$INPUT_CSV" ]; then
            echo "Missing input CSV: $INPUT_CSV"
            exit 1
          fi

          python refine_improve_recompute_batch_f5.py \
            --inputs "$INPUT_CSV" \
            --solver-bin C_Version/read_data_f5 \
            --n-truck "$N_TRUCK" \
            --n-drone "$N_DRONE" \
            --workers "$WORKERS" \
            --ls-time-limit-sec "$LS_TIME_LIMIT_SEC"

      - name: Upload refined outputs
        uses: actions/upload-artifact@v4
        with:
          name: refined-f5-${{ matrix.task.idx }}-${{ matrix.task.name }}
          path: |
            result/Question4,14/refined_csv_2truck_1drone
            result/Question4,14/ls_outputs_f5_row_jobs
          if-no-files-found: warn
